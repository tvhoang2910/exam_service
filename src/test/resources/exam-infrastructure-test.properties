# 1. C?U HÌNH DATABASE MOCK
spring.datasource.url=jdbc:h2:mem:exam_test_db;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# B? qua k?t n?i RabbitMQ th?t
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
management.health.rabbit.enabled=false

# 2. C?U HÌNH UPLOAD (Vi?t tách dòng ?? ch?c ch?n 100% ?n vào List<String>)
exam.upload.presign-put-ttl-seconds=900
exam.upload.presign-get-ttl-seconds=600
exam.upload.max-pages=20

exam.upload.allowed-content-types[0]=image/jpeg
exam.upload.allowed-content-types[1]=image/png
exam.upload.allowed-content-types[2]=image/webp
exam.upload.allowed-content-types[3]=application/pdf