spring.main.lazy-initialization=false
spring.jpa.hibernate.ddl-auto=update
spring.task.scheduling.enabled=false

# JWT (must match what auth_service issues)
auth.jwt.issuer=auth_service
auth.jwt.secret=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWYwMTIzNDU2Nzg5YWJjZGVmMDEyMzQ1Njc4OWFiY2RlZg==

# Database - point to running postgres (password from .env: DATABASE_PASSWORD=27092005)
spring.datasource.url=jdbc:postgresql://localhost:5432/exam_bank_db
spring.datasource.username=postgres
spring.datasource.password=27092005
spring.datasource.driver-class-name=org.postgresql.Driver

# Disable .env import during tests to avoid loading conflicting values
spring.config.import=

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s
spring.data.jpa.repositories.enabled=true
spring.data.redis.repositories.enabled=false

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=exam_bank
spring.rabbitmq.password=exam_bank

# CORS
app.cors.allowed-origins=http://localhost:5173

# RabbitMQ events
exam.events.exchange=exam.events
exam.events.routing-key=exam.submitted
exam.events.queue=exam.events.queue
auth.events.exchange=auth.events
auth.events.user-profile-sync-routing-key=auth.user.profile.sync
auth.events.user-profile-sync.queue=exam.auth.user-profile-sync.queue
exam.events.file-uploaded-routing-key=exam.source.uploaded
exam.events.ai-extracted-routing-key=search.ai.extracted
exam.extraction.result.queue=exam.extraction.result.queue
exam.events.sync-routing-key=exam.sync

# MinIO (mock in test)
minio.url=http://localhost:9000
minio.access-key=test-access
minio.secret-key=test-secret
minio.bucket-name=test-exam-sources

# Upload settings
exam.upload.presign-put-ttl-seconds=900
exam.upload.presign-get-ttl-seconds=600
exam.upload.max-pages=20
exam.upload.allowed-content-types=image/jpeg,image/png,image/webp,application/pdf

# Reporting
app.reporting.auto-hide-threshold=5

# Notification
notification.exchange=notification.events
notification.admin-alert-routing-key=notification.send.admin.alert

# Disable rabbit health
management.health.rabbit.enabled=false
